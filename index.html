<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content makes Chrome/Android shrink the layout
         viewport when the virtual keyboard opens, so the inquiry dialog's sticky
         action band rides above the keyboard instead of behind it. iOS Safari
         ignores it, and it has no effect on a page with no focused input. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="FutureAds — Give your brand a FUTURE. A creative advertising agency crafting bold, impactful campaigns." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- DM Sans replaces Inter for CONTENT. Space Grotesk (titles) is a
         geometric grotesque, and Inter's neutral neo-grotesque lowercase sat
         beside it as a different voice rather than a supporting one; DM Sans
         shares the circular bowls and the single-storey feel, so the page reads
         as one typeface family at two weights of personality. The opsz axis is
         requested so font-optical-sizing:auto in globals.css actually has an
         axis to work with — small text gets slightly more open shapes.
         Titles and numerals are untouched: Space Grotesk 500/600/700 and
         JetBrains Mono 400/500 are the same requests as before. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>FutureAds — Give Your Brand a FUTURE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
